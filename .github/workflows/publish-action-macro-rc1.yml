name: Publish Action Macro RC1
on:
  push:
    branches: [feature/action-recorder]
    paths: ['.github/workflows/publish-action-macro-rc1.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-action-macro-rc1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'gitlid/QtScrcpy' && github.ref == 'refs/heads/feature/action-recorder'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: gitlid/QtScrcpy
      VERIFIED_RUN: '34013708478'
      VERIFIED_MAIN: '17914a21bf0f97570c8cc785f36f4768f56cbd0e'
      VERIFIED_CORE: 'b9db44edaf4beb4554a952053a43526ddae4d8d8'
      RELEASE_TAG: 'action-macro-v0.1.0-rc.1'
    steps:
      - name: Verify the exact successful build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == os.environ['VERIFIED_MAIN']
          assert run['head_branch'] == 'feature/action-recorder'
          assert run['path'] == '.github/workflows/action-macro-rc.yml'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          PY
      - name: Download and verify the immutable build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name "QtScrcpy-action-macro-win64-$VERIFIED_MAIN" --dir artifact
          cd artifact
          sha256sum --check QtScrcpy-action-macro-0.1.0-rc.1-win64.zip.sha256
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('QtScrcpy-action-macro-0.1.0-rc.1-win64.zip') as archive:
              info_paths = [p for p in archive.namelist() if p.endswith('/build-info.json')]
              assert len(info_paths) == 1
              info = json.loads(archive.read(info_paths[0]).decode('utf-8-sig'))
              assert info['mainCommit'] == os.environ['VERIFIED_MAIN']
              assert info['coreCommit'] == os.environ['VERIFIED_CORE']
              assert info['deviceTested'] is False
              assert info['version'] == '0.1.0-rc.1'
          PY
      - name: Create a new prerelease without replacing an existing tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'The release already exists. Refusing to replace its tag or assets.'
            exit 1
          fi
          cat > notes.md <<'NOTES'
          # QtScrcpy 操作宏 0.1.0-rc.1

          首个实体手机试用候选版，不是 QtScrcpy 上游官方发行版。默认分支及两个草稿 PR 均未合并。

          ## 使用
          下载 `QtScrcpy-action-macro-0.1.0-rc.1-win64.zip`，完整解压到新目录，运行 `QtScrcpy.exe`。连接手机并打开投屏，在工具栏的播放圆圈图标中打开 Action Macro。先在安全测试页面录制、保存并单次回放，再验证有限循环和紧急停止。

          ## 本轮完善
          - 严格的 JSON、时间戳、坐标、文本及资源限制校验；失败加载保留已有宏。
          - 停止录制补齐释放事件；保留录制末尾等待；停止时清理待发及映射器延迟操作。
          - 播放期间隔离手动输入，连接发送失败、屏幕尺寸变化或严重迟到时停止。
          - 未保存提示、断连窗口禁用、关闭窗口先停止；Windows 尝试注册全局 Ctrl+Shift+X，并明确显示注册失败的应用内回退。

          ## 验证
          核心独立 CTest 28/28 通过，Linux AddressSanitizer/UndefinedBehaviorSanitizer 测试通过。
          Windows MSVC 2022 x64 / Qt 5.15.2 完整构建、核心回归、5 项控制器/界面集成测试及无设备启动冒烟测试通过。
          构建记录：https://github.com/gitlid/QtScrcpy/actions/runs/34013708478
          核心测试：https://github.com/gitlid/QtScrcpyCore/actions/runs/34013223856

          对应源码主提交：`17914a21bf0f97570c8cc785f36f4768f56cbd0e`
          核心提交：`b9db44edaf4beb4554a952053a43526ddae4d8d8`
          主 PR：https://github.com/gitlid/QtScrcpy/pull/1
          核心 PR：https://github.com/gitlid/QtScrcpyCore/pull/1

          ## 尚待实测
          实体手机兼容性、游戏映射和实际延迟未验收。释放消息不是手机端执行确认。脚本使用绝对坐标，没有图像识别或页面条件等待；不要在支付、删除等高风险页面试用，不要录制或分享敏感文字/剪贴板内容。
          NOTES
          gh release create "$RELEASE_TAG" \
            artifact/QtScrcpy-action-macro-0.1.0-rc.1-win64.zip \
            artifact/QtScrcpy-action-macro-0.1.0-rc.1-win64.zip.sha256 \
            --repo "$GH_REPO" --target "$VERIFIED_MAIN" \
            --title 'QtScrcpy Action Macro 0.1.0-rc.1 — Windows x64' \
            --notes-file notes.md --prerelease --latest=false
