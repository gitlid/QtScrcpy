name: ScrcpyKeyMapper integration
on:
  push:
    branches: [feature/scrcpy-keymapper]
    paths: ['QtScrcpy/**', 'tests/**', 'ci/**', 'CMakeLists.txt', '.gitmodules', '.github/workflows/keymapper-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keymapper-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'gitlid/QtScrcpy' && github.ref == 'refs/heads/feature/scrcpy-keymapper'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve UTF-8 LF source files
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          modules: qtwebengine
          cache: true
      - name: Apply the reviewed host integration once
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check ci/keymapper-host.patch; then
            git apply ci/keymapper-host.patch
          else
            git apply --reverse --check ci/keymapper-host.patch
          fi
          git diff --check
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-keymapper -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DQSC_BUILD_ACTION_MACRO_TESTS=ON -DQSC_WITH_KEYMAPPER=ON
          if($LASTEXITCODE -ne 0){throw 'Configure failed'}
          cmake --build build-keymapper --config RelWithDebInfo --parallel 4
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
      - name: Native controller, macro and legacy UI regression
        shell: pwsh
        run: |
          $env:PATH="$(Join-Path $PWD 'output/x64/RelWithDebInfo');$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          ctest --test-dir build-keymapper -C RelWithDebInfo -E keymapper_native_bridge --output-on-failure --output-junit results.xml --timeout 60
          if($LASTEXITCODE -ne 0){throw 'Regression failed'}
      - name: Offline embedded editor on Windows
        shell: pwsh
        run: |
          $env:PATH="$(Join-Path $PWD 'output/x64/RelWithDebInfo');$env:PATH"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:QSC_KEYMAPPER_SCREENSHOT=Join-Path $PWD 'build-keymapper/keymapper-native.png'
          ctest --test-dir build-keymapper -C RelWithDebInfo -R keymapper_native_bridge --output-on-failure --output-junit web-results.xml --timeout 45
          if($LASTEXITCODE -ne 0){throw 'Embedded editor test failed'}
      - name: Commit only the tested host integration on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add QtScrcpy/main.cpp QtScrcpy/ui/actionmacrodialog.cpp QtScrcpy/ui/keymapdocument.h QtScrcpy/ui/keymapeditor.cpp QtScrcpy/ui/keymapeditor.h QtScrcpy/ui/mouselookcursor.h QtScrcpy/ui/videoform.cpp QtScrcpy/ui/videoform.h tests/CMakeLists.txt tests/mousebinding_ui_test.cpp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate verified upstream editor host and RC3 cursor fixes'
            git push origin HEAD:refs/heads/feature/scrcpy-keymapper
          fi
          git rev-parse HEAD > tested-commit.txt
      - name: Package portable Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='QtScrcpy-keymapper-0.3.0-rc.1-win64'
          $package=Join-Path $PWD "dist/$name"
          New-Item $package -ItemType Directory -Force | Out-Null
          Copy-Item 'output/x64/RelWithDebInfo/*' $package -Recurse
          Copy-Item 'config','keymap' $package -Recurse
          Copy-Item 'LICENSE' (Join-Path $package 'LICENSE-QtScrcpy')
          Copy-Item 'QtScrcpy/QtScrcpyCore/LICENSE' (Join-Path $package 'LICENSE-QtScrcpyCore')
          Copy-Item 'docs/keymapper-integration.zh-CN.md' (Join-Path $package 'README-Keymapper.zh-CN.md')
          Get-ChildItem $package -Include '*.lib','*.pdb','*.exp' -Recurse | Remove-Item
          windeployqt --release --no-translations (Join-Path $package 'QtScrcpy.exe')
          if($LASTEXITCODE -ne 0){throw 'Qt deployment failed'}
          foreach($dll in @('msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll')){Copy-Item (Join-Path $env:WINDIR "System32/$dll") $package}
          if(!(Test-Path (Join-Path $package 'QtWebEngineProcess.exe'))){throw 'Missing QtWebEngineProcess.exe'}
          if(!(Test-Path (Join-Path $package 'resources/qtwebengine_resources.pak'))){throw 'Missing WebEngine resources'}
          $qtPrefix=(& qmake -query QT_INSTALL_PREFIX).Trim()
          foreach($entry in @(@{Name='upstream';Root=(Join-Path $PWD 'QtScrcpy/QtScrcpyCore/src/third_party')},@{Name='Qt';Root=$qtPrefix})){
            Get-ChildItem $entry.Root -File -Recurse | Where-Object {$_.Name -match '^(LICENSE|COPYING|NOTICE|COPYRIGHT)(\.|$|-)'} | ForEach-Object {
              $relative=[IO.Path]::GetRelativePath($entry.Root,$_.FullName)
              $target=Join-Path $package "licenses/$($entry.Name)/$relative"
              New-Item (Split-Path $target) -ItemType Directory -Force | Out-Null
              Copy-Item $_.FullName $target
            }
          }
          New-Item (Join-Path $package 'licenses/ScrcpyKeyMapper') -ItemType Directory -Force | Out-Null
          Copy-Item 'QtScrcpy/third_party/ScrcpyKeyMapper/LICENSE' (Join-Path $package 'licenses/ScrcpyKeyMapper/LICENSE')
          Copy-Item 'build-keymapper/QtScrcpy/keymapper/assets/licenses/*' (Join-Path $package 'licenses/ScrcpyKeyMapper')
          Copy-Item 'build-keymapper/QtScrcpy/keymapper/assets/UPSTREAM.txt' (Join-Path $package 'licenses/ScrcpyKeyMapper/UPSTREAM.txt')
          $mainSha=git rev-parse HEAD
          $coreSha=git -C QtScrcpy/QtScrcpyCore rev-parse HEAD
          $editorSha=git -C QtScrcpy/third_party/ScrcpyKeyMapper rev-parse HEAD
          @{version='0.3.0-rc.1';mainCommit=$mainSha;coreCommit=$coreSha;editorCommit=$editorSha;runId=$env:GITHUB_RUN_ID;newFeaturesDeviceTested=$false;maximumPlaybackSpeed=8;audioChanged=$false;embeddedOfflineEditor=$true} | ConvertTo-Json | Set-Content (Join-Path $package 'build-info.json') -Encoding utf8
          $p=Start-Process (Join-Path $package 'QtScrcpy.exe') -WorkingDirectory $package -PassThru
          Start-Sleep -Seconds 5
          if($p.HasExited){throw "Startup failed: $($p.ExitCode)"}
          Stop-Process -Id $p.Id
          $zip=Join-Path $PWD "dist/$name.zip"
          Compress-Archive $package $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $name.zip`n")
          Write-Output "Package SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-Keymapper-win64
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keymapper-windows-results
          path: |
            build-keymapper/Testing/Temporary/*.log
            build-keymapper/results.xml
            build-keymapper/web-results.xml
            build-keymapper/keymapper-native.png
            tested-commit.txt
