name: ScrcpyKeyMapper integration
on:
  push:
    branches: [dev, feature/scrcpy-keymapper, feature/live-tabs-rom-fix, feature/stable-view-orientation]
    tags: ['keymapper-v*']
    paths: ['QtScrcpy/**', 'tests/**', 'ci/**', 'config/**', 'keymap/**', 'CMakeLists.txt', '.gitmodules', '.github/workflows/keymapper-integration.yml']
  pull_request:
    branches: [dev]
    paths: ['QtScrcpy/**', 'tests/**', 'ci/**', 'config/**', 'keymap/**', 'CMakeLists.txt', '.gitmodules', '.github/workflows/keymapper-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keymapper-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.repository == 'gitlid/QtScrcpy'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve UTF-8 LF source files
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          modules: qtwebengine
          cache: true
          # Use the runner's 7-Zip instead of py7zr's intermittent Windows path-check failure.
          extra: --external 7z
      - name: Configure and build committed sources
        id: build
        shell: pwsh
        run: |
          cmake -S . -B build-keymapper -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DQSC_BUILD_ACTION_MACRO_TESTS=ON -DQSC_WITH_KEYMAPPER=ON
          if($LASTEXITCODE -ne 0){throw 'Configure failed'}
          cmake --build build-keymapper --config RelWithDebInfo --parallel 4
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Build changed tracked sources'}
          git rev-parse HEAD | Set-Content tested-commit.txt
      - name: Native controller, macro and legacy UI regression
        shell: pwsh
        run: |
          $env:PATH="$(Join-Path $PWD 'output/x64/RelWithDebInfo');$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QSC_LOCKED_VIEW_SCREENSHOT=Join-Path $PWD 'build-keymapper/locked-view-'
          $env:QSC_APPBAR_SCREENSHOT=Join-Path $PWD 'build-keymapper/appbar'
          $env:QSC_VIEW_SCREENSHOT=Join-Path $PWD 'build-keymapper/view-rotation.png'
          $env:QSC_ROTATION_SCREENSHOT=Join-Path $PWD 'build-keymapper/rotation-menu.png'
          ctest --test-dir build-keymapper -C RelWithDebInfo -E keymapper_native_bridge --output-on-failure --output-junit results.xml --timeout 60
          if($LASTEXITCODE -ne 0){throw 'Regression failed'}
      - name: Offline embedded editor on Windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:PATH="$(Join-Path $PWD 'output/x64/RelWithDebInfo');$env:PATH"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:QSC_KEYMAPPER_SCREENSHOT=Join-Path $PWD 'build-keymapper/keymapper-native.png'
          ctest --test-dir build-keymapper -C RelWithDebInfo -R keymapper_native_bridge --output-on-failure --output-junit web-results.xml --timeout 45
          if($LASTEXITCODE -ne 0){throw 'Embedded editor test failed'}
      - name: Package and verify portable editor independently of installed Qt
        shell: pwsh
        run: |
          & ./ci/package-keymapper.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-Keymapper-win64
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keymapper-windows-results
          path: |
            build-keymapper/Testing/Temporary/*.log
            build-keymapper/results.xml
            build-keymapper/web-results.xml
            build-keymapper/keymapper-native.png
            build-keymapper/rotation-menu.png
            build-keymapper/view-rotation.png
            build-keymapper/appbar*.png
            build-keymapper/locked-view-*.png
            build-keymapper/portable-editor*
            build-keymapper/portable-test/Testing/Temporary/*.log
            build-keymapper/portable-test/results.xml
            tested-commit.txt
